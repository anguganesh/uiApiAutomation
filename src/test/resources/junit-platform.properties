# Instead of Using Junit Configuration, Used Cucumber configuration to run scripts using Junit
# Cucumber Parallel execution properties
cucumber.execution.parallel.enabled = true
cucumber.execution.parallel.config.strategy = fixed
cucumber.execution.parallel.config.fixed.parallelism = 1

#Thread Count
cucumber.execution.parallel.config.fixed.max-pool-size = 3

cucumber.junit-platform.discovery.as-root-engine=true
cucumber.junit-platform.naming-strategy=long

